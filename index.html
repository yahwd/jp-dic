<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>雪妖精の辭書</title>
  <meta name="theme-color" content="#263964" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="雪妖精の辭書" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.webmanifest?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png?v=2" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=2" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/style.css?v=26" />
</head>
<body>
  <div class="container">
    <div class="sticky-top" id="stickyTop">
    <header>
      <div class="brand" id="brandHomeBtn" role="button" tabindex="0" title="回到辭書首頁">
        <img class="brand-logo" src="./icons/logo-108.png?v=2" srcset="./icons/logo-72.png?v=2 2x, ./icons/logo-108.png?v=2 3x" alt="" width="36" height="36" />
        <h1>雪妖精の辭書</h1>
      </div>
      <div class="header-right">
        <div class="db-status" id="dbStatus" role="status">
          <span class="status-dot loading" id="statusDot"></span>
          <span id="statusText">Importing...</span>
        </div>
        <div class="account-wrap" id="accountWrap">
          <button class="account-btn" id="accountBtn" type="button" title="登入 Google 帳號開啟跨裝置同步" aria-label="登入 Google 帳號開啟跨裝置同步" aria-expanded="false">
            <img class="account-avatar-img" id="accountAvatarImg" src="./icons/avatar-guest.png" alt="帳號頭像" />
            <span class="account-sync-badge" id="accountSyncBadge" style="display:none;" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>

    <div class="search-wrapper">
      <div class="search-input-box">
        <svg class="search-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="輸入日文、中文、英文或羅馬拼音" autocomplete="off" />
        <button class="clear-btn" id="clearBtn" title="清除">×</button>
      </div>
      <div class="segment-bar" id="segmentBar" style="display:none;" role="tablist" aria-label="斷詞結果"></div>
    </div>


    <nav class="tabs">
      <button class="tab-btn active" data-tab="search">
        搜尋結果 <span class="badge" id="resultCount" style="display:none;">0</span>
      </button>
      <button class="tab-btn icon-tab push-right" data-tab="favorites" title="我的收藏" aria-label="我的收藏">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><span class="badge" id="favCount" style="display:none;">0</span>
      </button>
      <button class="tab-btn icon-tab quiz-entry-btn" id="quizEntryBtn" data-tab="quiz" type="button" title="每日小考" aria-label="每日小考">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
        <span class="quiz-pending-dot" id="quizPendingDot" style="display:none;" aria-hidden="true"></span>
      </button>
      <button class="tab-btn icon-tab" data-tab="history" title="搜尋歷史" aria-label="搜尋歷史">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15.5 14"></polyline></svg>
      </button>
    </nav>
    </div>

    <div id="strategyArea"></div>
    <main id="mainContent"></main>

    <div class="load-banner" id="localLoaderBanner" style="display:none;">
      <div>
        <strong>本機雙擊開啟提示：</strong>若您直接雙擊 <code>index.html</code> 開啟，因瀏覽器安全限制無法自動讀取 <code>data/</code> 資料夾，請手動選取 <code>data/dict_all.json</code> 與 <code>data/zh_bridge.json</code>（上傳至網站空間則會自動載入）。
      </div>
      <label class="file-upload-label">
        手動選取 data 檔案
        <input type="file" id="jsonFileInput" accept=".json" multiple style="display:none;" />
      </label>
    </div>

    <footer>
      僅供個人學習使用 · 詞庫為離線查詢；查不到時才會把搜尋文字送到線上翻譯服務 · 收藏與歷史紀錄儲存於本機瀏覽器
    </footer>
  </div>

  <script src="./assets/firebase-config.js?v=27"></script>
  <script src="./assets/syn-ant.js?v=27"></script>
  <script src="./assets/quiz-synonyms.js?v=27"></script>
  <script src="./assets/app.js?v=27"></script>
</body>
</html>
